<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order on WhatsApp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="storeName"></h1>
      <p>Pick what you need, add your details, and your order goes straight to us on WhatsApp.</p>
    </div>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  <p class="status" id="status" role="status"></p>
  <div class="layout">
    <main><div class="grid" id="grid"></div></main>
    <aside id="cart" aria-label="Your order">
      <div id="orderForm">
      <h2>Your order</h2>
      <div id="lines"></div>
      <div class="total"><span>Total</span><span id="total"></span></div>
      <div class="seg" role="radiogroup" aria-label="Delivery or collection">
        <label><input type="radio" name="mode" value="Collection" checked>Collect</label>
        <label><input type="radio" name="mode" value="Delivery">Deliver</label>
      </div>
      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="name">
      <div id="addrBox" hidden>
        <label for="area">Delivery area</label>
        <select id="area"></select>
        <label for="addr">Street address</label>
        <textarea id="addr" autocomplete="street-address"></textarea>
      </div>
      <label for="note">Notes (optional)</label>
      <textarea id="note" placeholder="e.g. no onions, call when outside"></textarea>
      <fieldset id="payBox" hidden>
        <legend>How will you pay?</legend>
        <div class="seg wrapseg" id="payOpts"></div>
        <div class="payinfo" id="payInfo" hidden></div>
      </fieldset>
      <p class="err" id="err" role="alert"></p>
      <button class="btn big" id="send">Send order on WhatsApp</button>
      </div>
      <div id="sent" hidden>
        <h2>Order sent ✓</h2>
        <p class="empty">Check your order below. If something is wrong, change it and send it again.</p>
        <div id="sentLines"></div>
        <div class="total"><span>Total</span><span id="sentTotal"></span></div>
        <div class="payinfo" id="sentInfo"></div>
        <button class="btn big" id="fixBtn">Something wrong? Change my order</button>
        <button class="chip wide" id="newBtn">Done – start a new order</button>
      </div>
    </aside>
  </div>
</div>
<div class="bar" id="bar"><a href="#cart"><span id="barCount">0 items</span><span id="barTotal"></span></a></div>
<div id="lightbox" hidden>
  <button id="lbClose" aria-label="Close photo">×</button>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>
<script src="script.js"></script>
</body>
</html>
